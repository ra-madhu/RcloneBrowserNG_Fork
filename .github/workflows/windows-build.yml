name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

env:
  # FIX: Handles the runner environment migration notice gracefully
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Install MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt 6 Framework
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3' 
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Configure CMake Project
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF ..


    - name: Compile and Build App
      run: |
        cd build
        cmake --build . --config Release

    - name: Clean and Strip Binary
      run: |
        cd build
        # Check if the output lands inside the src subdirectory or root build folder
        if (Test-Path "src/Release") { cd src/Release } else { cd Release }
        
        # FIX: Remove heavy debug tracking map file to make the app light
        if (Test-Path "RcloneBrowser.pdb") { Remove-Item "RcloneBrowser.pdb" }
        
        # Deploy standalone core runtime libraries
        windeployqt --release RcloneBrowser.exe

    - name: Package Windows Binary
      run: |
        cd build
        # Compress whatever output folder contains our newly deployed binaries
        if (Test-Path "src/Release/RcloneBrowser.exe") {
            Compress-Archive -Path src/Release/* -DestinationPath RcloneBrowser-Windows.zip
        } else {
            Compress-Archive -Path Release/* -DestinationPath RcloneBrowser-Windows.zip
        }

    - name: Upload Finished Application
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Build-Binary
        path: build/RcloneBrowser-Windows.zip
