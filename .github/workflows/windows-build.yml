name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # FIX: Changed creator name from jwlawrence to jwlawson
    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Install MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt 6 Framework
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3' 
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Configure CMake Project
      run: |
        mkdir build
        cd build
        # FIX: Explicitly forcing CXX Standard flags to bypass the internal Qt6 stdext macro error
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_STANDARD_REQUIRED=ON ..


    - name: Compile and Build App
      run: |
        cd build
        cmake --build . --config Release

    - name: Package Windows Binary
      run: |
        cd build
        windeployqt --release Release/RcloneBrowser.exe
        Compress-Archive -Path Release/* -DestinationPath RcloneBrowser-Windows.zip

    # FIX: Changed actions/artifacts to actions/upload-artifact@v4
    - name: Upload Finished Application
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Build-Binary
        path: build/RcloneBrowser-Windows.zip
