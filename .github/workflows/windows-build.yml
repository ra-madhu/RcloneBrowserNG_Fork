name: Build Windows Application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Install MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Qt 6 Framework
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3' 
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Configure CMake Project
      run: |
        mkdir build
        cd build
        # FIX: Forcing MSVC to skip the restrictive stdext validation loop using custom compiler flags
        cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="/D_SILENCE_STDEXT_ARR_IT_DEPRECATION_WARNING" -DBUILD_TESTING=OFF ..

    - name: Compile and Build App
      run: |
        cd build
        cmake --build . --config Release

    - name: Clean and Strip Binary
      run: |
        cd build
        cd src/Release
        # Remove heavy debugging files
        if (Test-Path "RcloneBrowser.pdb") { Remove-Item "RcloneBrowser.pdb" }
        # Deploy deployment runtimes dynamically
        windeployqt --release RcloneBrowser.exe

    - name: Package Windows Binary
      run: |
        cd build
        Compress-Archive -Path src/Release/* -DestinationPath RcloneBrowser-Windows.zip

    - name: Upload Finished Application
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Build-Binary
        path: build/RcloneBrowser-Windows.zip
